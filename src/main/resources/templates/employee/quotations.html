
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Quotations | Pravin Kitchens</title>

    <link rel="stylesheet"
          th:href="@{/css/employee-quotations.css}">

</head>

<body>

<div class="page-header">

    <div>
        <h1>My Quotations</h1>
        <p class="subtitle">
            View and manage your customer quotations.
        </p>
    </div>

    <div class="header-actions">

        <a th:href="@{/employee/dashboard}"
           class="btn btn-secondary">
            ← Back to Dashboard
        </a>

        <a th:href="@{/employee/quotations/new}"
           class="btn btn-primary">
            + Create Quotation
        </a>

    </div>

</div>

<div class="table-card">

    <table>

        <thead>
        <tr>
            <th>Quotation No</th>
            <th>Date</th>
            <th>Customer</th>
            <th>Branch</th>
            <th>Status</th>
            <th>Total</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="quotation : ${quotations}">

            <td class="quotation-number"
                th:text="${quotation.quotationNumber}">
                QT-00001
            </td>

            <td th:text="${quotation.quotationDate}">
                01/10/2026
            </td>

            <td th:text="${quotation.customer != null
                    ? quotation.customer.name
                    : 'N/A'}">
                Customer
            </td>

            <td th:text="${quotation.branch != null
                    ? quotation.branch.name
                    : 'N/A'}">
                Branch
            </td>

            <td>
                <span class="status"
                      th:classappend="${quotation.status != null
                          and quotation.status.name() == 'APPROVED'
                          ? ' status-approved'
                          : (quotation.status != null
                              and quotation.status.name() == 'PENDING'
                              ? ' status-pending'
                              : (quotation.status != null
                                  and quotation.status.name() == 'DRAFT'
                                  ? ' status-draft' : ''))}"
                      th:text="${quotation.status}">
                    DRAFT
                </span>
            </td>

            <td>
                ₹ <span th:text="${quotation.grandTotal}">0.00</span>
            </td>

            <td>
                <a th:href="@{/employee/quotations/view/{id}(id=${quotation.id})}"
                   class="open-btn">
                    Open Quotation →
                </a>
            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(quotations)}">
            <td colspan="7" class="empty-message">
                No quotations found. Create your first quotation to get started.
            </td>
        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
