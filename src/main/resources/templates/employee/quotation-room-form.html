<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Room | Pravin KITCHENS & INTERIORS</title>

    <link rel="stylesheet"
          th:href="@{/css/employee-nav.css}">
    <link rel="stylesheet"
          th:href="@{/css/employee-quotation-room-form.css}">


</head>

<body>

<div class="dashboard-wrapper">

    <!-- SIDEBAR -->
    <aside th:replace="~{fragments/employee-navigation :: sidebar(activeTab='quotations')}"></aside>


    <main class="main-content">

        <!-- TOPBAR -->
        <header th:replace="~{fragments/employee-navigation :: topbar(pageLabel='QUOTATION MANAGEMENT', pageTitle='Add Room / Work Area', pageSubtitle='Add a work area to this quotation.')}"></header>


        <div class="room-container">

            <div class="room-card">

                <div class="room-header">

                    <h2>
                        Add Room / Work Area
                    </h2>

                    <p>
                        Define where the work will be carried out.
                    </p>

                </div>


                <div class="quote-info">

                    Quotation:

                    <strong
                            th:text="${quotation.quotationNumber}">
                        QT-00001
                    </strong>

                    &nbsp; | &nbsp;

                    Customer:

                    <strong
                            th:text="${quotation.customer.name}">
                        Customer
                    </strong>

                </div>


                <form method="post"
                      th:action="@{/employee/quotations/view/{id}/room/save(id=${quotation.id})}">


                    <div class="form-grid">


                        <div class="form-group">

                            <label>
                                Floor
                            </label>

                            <input type="text"
                                   name="floor"
                                   placeholder="Example: Ground Floor"
                                   required>

                        </div>


                        <div class="form-group">

                            <label>
                                Room / Work Area
                            </label>

                            <select name="room"
                                    required>

                                <option value="">
                                    Select Work Area
                                </option>

                                <option value="Kitchen">
                                    Kitchen
                                </option>

                                <option value="Bedroom">
                                    Bedroom
                                </option>

                                <option value="Living Room">
                                    Living Room
                                </option>

                                <option value="Dining Room">
                                    Dining Room
                                </option>

                                <option value="Wall Panel">
                                    Wall Panel
                                </option>

                                <option value="Wardrobe">
                                    Wardrobe
                                </option>

                                <option value="TV Unit">
                                    TV Unit
                                </option>

                                <option value="Full Interior">
                                    Full Interior
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <div class="form-group full">

                            <label>
                                Work Description
                            </label>

                            <textarea
                                    name="workDescription"
                                    placeholder="Example: Modular kitchen with bottom cabinet, wall cabinet and accessories"></textarea>

                        </div>

                    </div>


                    <div class="actions">

                        <a class="btn btn-secondary"
                           th:href="@{/employee/quotations/view/{id}(id=${quotation.id})}">

                            Cancel

                        </a>


                        <button type="submit"
                                class="btn btn-primary">

                            Save Room & Continue →

                        </button>

                    </div>

                </form>

            </div>

        </div>


        <footer class="dashboard-footer">

            <span>
                © 2026 Pravin KITCHENS & INTERIORS
            </span>

            <span>
                Employee Portal
            </span>

        </footer>

    </main>

</div>

<script th:src="@{/js/employee-session.js}"></script>
</body>

</html>
