<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Common Admin Navigation Head Assets -->
    <th:block th:fragment="head-assets">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
        <link rel="stylesheet" th:href="@{/css/theme.css}">
        <link rel="stylesheet" th:href="@{/css/admin-nav.css}">
    </th:block>
</head>
<body>

<!-- ========================================================= -->
<!-- TOP NAVBAR -->
<!-- ========================================================= -->
<nav class="top-navbar" th:fragment="top-navbar">

    <div class="brand-section">
        <div class="brand-icon">
            <img th:src="@{/images/company-logo.png}" alt="Pravin KITCHENS &amp; INTERIORS" class="brand-logo-img">
        </div>
        <div class="brand-text">
            <h5>Pravin KITCHENS &amp; INTERIORS</h5>
            <span>Quotation Management System</span>
        </div>
    </div>

    <div class="admin-section">
        <div class="admin-info">
            <div class="admin-avatar">
                SA
            </div>
            <div>
                <strong>Super Admin</strong>
                <small>Administrator</small>
            </div>
        </div>

        <a th:href="@{/admin/change-password}" class="change-password-btn" title="Change Password" style="display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; font-size: 13px; font-weight: 600; border-radius: 8px; text-decoration: none; color: #024541; background: #EAF3F1; border: 1px solid #D6E4E1; transition: all 0.2s ease;">
            <i class="bi bi-key-fill"></i>
            <span>Change Password</span>
        </a>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </button>
        </form>
    </div>

</nav>

<!-- ========================================================= -->
<!-- SIDEBAR -->
<!-- ========================================================= -->
<aside class="sidebar" th:fragment="sidebar(activeTab)">

    <div class="sidebar-menu">

        <!-- Dashboard -->
        <a th:href="@{/admin/dashboard}"
           class="sidebar-link"
           th:classappend="${activeTab == 'dashboard'} ? ' active' : ''">
            <i class="bi bi-grid-1x2-fill"></i>
            <span>Dashboard</span>
        </a>

        <!-- Employees -->
        <a th:href="@{/admin/employees}"
           class="sidebar-link"
           th:classappend="${activeTab == 'employees'} ? ' active' : ''">
            <i class="bi bi-people-fill"></i>
            <span>Employees</span>
        </a>

        <!-- Branches / Districts -->
        <a th:href="@{/admin/branches}"
           class="sidebar-link"
           th:classappend="${activeTab == 'branches'} ? ' active' : ''">
            <i class="bi bi-building"></i>
            <span>Branches / Districts</span>
        </a>

        <!-- Quotations -->
        <a th:href="@{/admin/quotations}"
           class="sidebar-link"
           th:classappend="${activeTab == 'quotations'} ? ' active' : ''">
            <i class="bi bi-file-earmark-text-fill"></i>
            <span>Quotations</span>
        </a>

        <!-- Customers -->
        <a th:href="@{/admin/customers}"
           class="sidebar-link"
           th:classappend="${activeTab == 'customers'} ? ' active' : ''">
            <i class="bi bi-person-lines-fill"></i>
            <span>Customers</span>
        </a>

        <!-- Pricing -->
        <a th:href="@{/admin/pricing}"
           class="sidebar-link"
           th:classappend="${activeTab == 'pricing'} ? ' active' : ''">
            <i class="bi bi-currency-rupee"></i>
            <span>Pricing</span>
        </a>

        <!-- Work Category -->
        <a th:href="@{/admin/work-categories}"
           class="sidebar-link"
           title="Work Category"
           th:classappend="${activeTab == 'work-categories' or activeTab == 'work-category'} ? ' active' : ''">
            <i class="bi bi-diagram-3-fill"></i>
            <span>Category</span>
        </a>

        <!-- Configure Master Data -->
        <a th:href="@{/admin/pricing/new}"
           class="sidebar-link"
           th:classappend="${activeTab == 'configure-master-data'} ? ' active' : ''">
            <i class="bi bi-sliders"></i>
            <span>Configure Master Data</span>
        </a>

        <!-- Security / Change Password -->
        <a th:href="@{/admin/change-password}"
           class="sidebar-link"
           th:classappend="${activeTab == 'change-password' or activeTab == 'security' or activeTab == 'settings'} ? ' active' : ''">
            <i class="bi bi-shield-lock-fill"></i>
            <span>Change Password</span>
        </a>

    </div>

    <!-- Sidebar Bottom -->
<!--    <div class="sidebar-bottom">-->
<!--        <div class="system-status">-->
<!--            <span class="status-dot"></span>-->
<!--            <div>-->
<!--                <strong>System Online</strong>-->
<!--                <small>All services running</small>-->
<!--            </div>-->
<!--        </div>-->
<!--    </div>-->

</aside>

</body>
</html>
