<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>Login | Pravin KITCHENS & INTERIORS &amp; INTERIORS</title>

  <link rel="stylesheet" th:href="@{/css/login.css}">

</head>
<body>
   <div class="login-container">

     <div class="login-card">

       <div class="logo">
         
         <img th:src="@{/images/company-logo.png}"
              alt="Pravin KITCHENS & INTERIORS "
              class="company-logo">
         
         <h1>Pravin KITCHENS & INTERIORS </h1>
         <p>Quotation Management System</p>

       </div>

       <div th:if="${param.error}"
            class="message error">
         Invalid email or password.
       </div>

       <div th:if="${param.logout}"
            class="message success">
         You have been logged out successfully.
       </div>

       <div th:if="${param.expired}"
            class="message error">
         Your session expired at 8:00 PM IST. Please log in again with Admin OTP.
       </div>

       <div th:if="${param.resetSuccess}"
            class="message success">
         Your password has been reset successfully. Please log in with your new password.
       </div>

       <form th:action="@{/login}" method="post">

         <div class="form-group">
           <label for="username">Email</label>

           <input
               type="email"
               id="username"
               name="username"
               placeholder="Enter your email"
               required>

         </div>

         <div class="form-group">
           <label for="password">Password</label>

           <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required>

         </div>

         <div class="form-footer-link">
           <a th:href="@{/employee/forgot-password}">Forgot Password?</a>
         </div>

         <button type="submit">
           Login
         </button>

       </form>

     </div>

   </div>

</body>
</html>
