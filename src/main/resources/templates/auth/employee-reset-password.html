<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Pravin KITCHENS & INTERIORS</title>
  <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
  <div class="login-container">
    <div class="login-card">

      <div class="logo">
        <img th:src="@{/images/company-logo.png}"
             alt="Pravin KITCHENS & INTERIORS"
             class="company-logo">
        <h1>Pravin KITCHENS & INTERIORS</h1>
        <p>Set New Password</p>
      </div>

      <!-- Error Alert -->
      <div th:if="${errorMessage}" class="message error" th:text="${errorMessage}">
        Validation error occurred.
      </div>

      <!-- Password Requirements -->
      <div class="password-policy">
        <strong>Password Requirements:</strong>
        <ul style="margin: 6px 0 0 18px; padding: 0;">
          <li>Minimum 8 characters in length</li>
          <li>Must contain at least one letter and one number</li>
          <li>Must match the confirmation password</li>
        </ul>
      </div>

      <form th:action="@{/employee/forgot-password/reset}" method="post" id="resetForm">
        <!-- CSRF Token automatically injected by Thymeleaf -->

        <div class="form-group">
          <label for="newPassword">New Password</label>
          <div class="password-wrapper">
            <input
                type="password"
                id="newPassword"
                name="newPassword"
                placeholder="Enter new password"
                minlength="8"
                required
                autofocus>
            <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('newPassword', this)" title="Show/Hide">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <div class="password-wrapper">
            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm new password"
                minlength="8"
                required>
            <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('confirmPassword', this)" title="Show/Hide">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="saveBtn">
          Save New Password &amp; Login
        </button>

        <a th:href="@{/login}" class="back-link">
          Cancel &amp; Return to Login
        </a>
      </form>

    </div>
  </div>

  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
      }
    }

    const resetForm = document.getElementById('resetForm');
    const saveBtn = document.getElementById('saveBtn');
    if (resetForm && saveBtn) {
      resetForm.addEventListener('submit', function() {
        saveBtn.disabled = true;
        saveBtn.textContent = 'Updating Password...';
      });
    }
  </script>
</body>
</html>
