<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title th:text="${item.id == null ? 'Add Item' : 'Edit Item'}">
    Item Form
  </title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <link rel="stylesheet"
        th:href="@{/css/item-form.css}">
</head>

<body>

<div class="item-page">

  <!-- ================= HEADER ================= -->

  <div class="page-header">

    <div>
      <span class="page-eyebrow">PRAVIN KITCHENS</span>

      <h1 th:text="${item.id == null ? 'Add Item' : 'Edit Item'}">
        Add Item
      </h1>

      <p>
        Create and manage quotation items under a division.
      </p>
    </div>

    <a th:href="@{/admin/items}"
       class="back-btn">
      ← Back to Items
    </a>

  </div>


  <!-- ================= FORM ================= -->

  <div class="form-card">

    <form th:action="${item.id == null}
                         ? @{/admin/items/save}
                         : @{/admin/items/update/{id}(id=${item.id})}"
          method="post">


      <!-- Item Name -->

      <div class="form-group">

        <label for="name">
          Item Name
          <span>*</span>
        </label>

        <input
                type="text"
                id="name"
                name="name"
                class="form-control"
                placeholder="Enter item name"
                th:value="${item.name}"
                maxlength="150"
                required>

        <small>
          Example: Base Cabinet, Wall Cabinet, Tall Unit, Island Unit
        </small>

      </div>


      <!-- Division -->

      <div class="form-group">

        <label for="divisionId">
          Division
          <span>*</span>
        </label>

        <select
                id="divisionId"
                name="divisionId"
                class="form-control"
                required>

          <option value="">
            Select Division
          </option>

          <option
                  th:each="division : ${divisions}"
                  th:value="${division.id}"
                  th:text="${division.workCategory.icon != null
                                      ? division.workCategory.icon + ' ' + division.workCategory.name + ' → ' + division.name
                                      : division.workCategory.name + ' → ' + division.name}"
                  th:selected="${item.division != null
                                         and item.division.id == division.id}">
          </option>

        </select>

        <small>
          Select the division where this item belongs.
        </small>

      </div>


      <!-- Description -->

      <div class="form-group">

        <label for="description">
          Description
        </label>

        <textarea
                id="description"
                name="description"
                class="form-control"
                rows="4"
                maxlength="500"
                placeholder="Enter a short description"
                th:text="${item.description}">
                </textarea>

      </div>


      <!-- Display Order -->

      <div class="form-group">

        <label for="displayOrder">
          Display Order
        </label>

        <input
                type="number"
                id="displayOrder"
                name="displayOrder"
                class="form-control"
                min="0"
                placeholder="0"
                th:value="${item.displayOrder != null ? item.displayOrder : 0}">

        <small>
          Lower numbers will appear first.
        </small>

      </div>


      <!-- Actions -->

      <div class="form-actions">

        <a th:href="@{/admin/items}"
           class="cancel-btn">
          Cancel
        </a>

        <button
                type="submit"
                class="save-btn"
                th:text="${item.id == null ? 'Create Item' : 'Update Item'}">
          Create Item
        </button>

      </div>

    </form>

  </div>

</div>

</body>
</html>
