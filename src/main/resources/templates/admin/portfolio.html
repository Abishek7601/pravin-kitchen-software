
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total Portfolio Value | Pravin Kitchens</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
            color: #202938;
        }

        .portfolio-container {
            padding: 30px;
        }

        .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .page-heading h2 {
            font-size: 27px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .summary-card {
            background: #fff;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 25px;
            border: 1px solid #e8ebf1;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }

        .summary-label {
            color: #687386;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .summary-value {
            font-size: 30px;
            font-weight: 700;
            color: #176b45;
            overflow-wrap: anywhere;
        }

        .table-card {
            background: #fff;
            border-radius: 14px;
            padding: 22px;
            border: 1px solid #e8ebf1;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }

        .table-responsive {
            margin-top: 18px;
        }

        .table th {
            background: #f3f5f9;
            white-space: nowrap;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #e8f1ff;
            color: #245bb5;
            font-size: 12px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .portfolio-container {
                padding: 16px;
            }

            .page-heading h2 {
                font-size: 22px;
            }

            .summary-value {
                font-size: 24px;
            }

            .table-card {
                padding: 14px;
            }
        }
    </style>
</head>

<body>
<main class="portfolio-container">

    <div class="page-heading">
        <div>
            <h2>Total Portfolio Value</h2>
            <p class="text-muted mb-0">
                Overview of quotation values recorded in the system.
            </p>
        </div>

        <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary">
            Back to Dashboard
        </a>
    </div>

    <section class="summary-card">
        <div class="summary-label">Total Portfolio Value</div>

        <div class="summary-value">
            ₹ <span th:text="${totalPortfolioValue != null
                              ? #numbers.formatDecimal(totalPortfolioValue, 1, 'COMMA', 2, 'POINT')
                              : '0.00'}">0.00</span>
        </div>
    </section>

    <section class="table-card">
        <h5 class="fw-bold">Quotation Details</h5>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Quotation No.</th>
                    <th>Customer</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th class="text-end">Amount (₹)</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="quotation : ${quotations}">
                    <td th:text="${quotation.quotationNumber}">QT-001</td>
                    <td th:text="${quotation.customer != null
                                  ? quotation.customer.name : '-'}">Customer</td>
                    <td th:text="${quotation.quotationDate}">2026-10-06</td>
                    <td>
                        <span class="status-badge"
                              th:text="${quotation.status}">PENDING</span>
                    </td>
                    <td class="text-end"
                        th:text="${quotation.grandTotal != null
                                  ? #numbers.formatDecimal(quotation.grandTotal, 1, 'COMMA', 2, 'POINT')
                                  : '0.00'}">0.00</td>
                </tr>

                <tr th:if="${#lists.isEmpty(quotations)}">
                    <td colspan="5" class="text-center text-muted py-4">
                        No quotations found.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>
</body>
</html>
