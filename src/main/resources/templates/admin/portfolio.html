
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total Portfolio Value | Pravin KITCHENS & INTERIORS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="/css/portfolio.css">
</head>

<body>
<main class="portfolio-container">

    <div class="page-heading">
        <div>
            <h2>Total Portfolio Value</h2>
            <p class="text-muted mb-0">
                Overview of quotation values recorded in the system.
            </p>
        </div>

        <div class="nav-header-actions" style="display: inline-flex; align-items: center; gap: 8px;">
            <button type="button" class="btn btn-outline-secondary btn-sm nav-back-btn" onclick="if (window.history.length > 1) { window.history.back(); } else { window.location.href='/admin/dashboard'; }" style="display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; background: #ffffff; border: 1px solid #c8dad6; color: #006b63; text-decoration: none; transition: all 0.2s ease;">
                <span>← Back</span>
            </button>
            <a th:href="@{/admin/dashboard}" class="btn btn-primary btn-sm nav-dashboard-btn" style="display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px; font-size: 13px; font-weight: 600; border-radius: 8px; text-decoration: none; background: #006b63; color: #ffffff; transition: all 0.2s ease;">
                <span>⌂ Dashboard</span>
            </a>
        </div>
    </div>

    <section class="summary-card">
        <div class="summary-label">Total Portfolio Value</div>

        <div class="summary-value">
            ₹ <span th:text="${totalPortfolioValue != null
                              ? #numbers.formatDecimal(totalPortfolioValue, 1, 'COMMA', 2, 'POINT')
                              : '0.00'}">0.00</span>
        </div>
    </section>

    <section class="table-card">
        <h5 class="fw-bold">Quotation Details</h5>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Quotation No.</th>
                    <th>Customer</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th class="text-end">Amount (₹)</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="quotation : ${quotations}">
                    <td th:text="${quotation.quotationNumber}">QT-001</td>
                    <td th:text="${quotation.customer != null
                                  ? quotation.customer.name : '-'}">Customer</td>
                    <td th:text="${quotation.quotationDate}">2026-10-06</td>
                    <td>
                        <span class="status-badge"
                              th:text="${quotation.status}">PENDING</span>
                    </td>
                    <td class="text-end"
                        th:text="${quotation.grandTotal != null
                                  ? #numbers.formatDecimal(quotation.grandTotal, 1, 'COMMA', 2, 'POINT')
                                  : '0.00'}">0.00</td>
                </tr>

                <tr th:if="${#lists.isEmpty(quotations)}">
                    <td colspan="5" class="text-center text-muted py-4">
                        No quotations found.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>
</body>
</html>
