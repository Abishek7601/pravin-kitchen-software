<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${division.id == null ? 'Add Division' : 'Edit Division'}">
        Division Form
    </title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          th:href="@{/css/admin-nav.css}">
    <link rel="stylesheet"
          th:href="@{/css/division-form.css}">
</head>

<body>

<nav th:replace="~{fragments/admin-navigation :: top-navbar}"></nav>

<div class="dashboard-layout">

    <aside th:replace="~{fragments/admin-navigation :: sidebar(activeTab=(${redirectUrl != null and (redirectUrl.contains('pricing/new') or redirectUrl.contains('configure'))} ? 'configure-master-data' : 'work-categories'))}"></aside>

    <main class="main-content">

<div class="division-page">

    <!-- Header -->
    <div class="page-header">

        <div>
            <span class="page-eyebrow">Pravin KITCHENS & INTERIORS</span>

            <h1 th:text="${division.id == null ? 'Add Division' : 'Edit Division'}">
                Add Division
            </h1>

            <p>
                Create and manage divisions under your work categories.
            </p>
        </div>

<!--        <div class="nav-header-actions" style="display: inline-flex; align-items: center; gap: 8px;">-->
<!--            <button type="button" class="btn btn-outline-secondary btn-sm nav-back-btn"-->

<!--                    onclick="const r = this.getAttribute('data-redirect'); if (r && r.trim().length > 0) { window.location.href = r; } else if (window.history.length > 1) { window.history.back(); } else { window.location.href='/admin/divisions'; }"-->
<!--                    style="display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; background: #ffffff; border: 1px solid #D6E4E1; color: #024541; text-decoration: none; transition: all 0.2s ease;">-->
<!--                <span>← Back</span>-->
<!--            </button>-->
<!--            <a th:href="@{/admin/dashboard}" class="btn btn-primary btn-sm nav-dashboard-btn" style="display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px; font-size: 13px; font-weight: 600; border-radius: 8px; text-decoration: none; background: #024541; color: #ffffff; transition: all 0.2s ease;">-->
<!--                <span>⌂ Dashboard</span>-->
<!--            </a>-->
<!--        </div>-->

    </div>


    <!-- Form Card -->
    <div class="form-card">

        <form th:action="${division.id == null}
                         ? @{/admin/divisions/save}
                         : @{/admin/divisions/update/{id}(id=${division.id})}"
              method="post">

            <input type="hidden" name="redirectUrl" th:value="${redirectUrl}" th:if="${redirectUrl != null and !redirectUrl.isBlank()}">

            <!-- Division Name -->
            <div class="form-group">

                <label for="name">
                    Division Name
                    <span>*</span>
                </label>

                <input
                        type="text"
                        id="name"
                        name="name"
                        class="form-control"
                        placeholder="Enter division name"
                        th:value="${division.name}"
                        required
                        maxlength="100">

                <small>
                    Example: L-Shape Kitchen, Straight Kitchen, Island Kitchen
                </small>

            </div>


            <!-- Work Category -->
            <div class="form-group">

                <label for="workCategoryId">
                    Work Category
                    <span>*</span>
                </label>

                <select
                        id="workCategoryId"
                        name="workCategoryId"
                        class="form-control"
                        required>

                    <option value="">
                        Select Work Category
                    </option>

                    <option
                            th:each="category : ${categories}"
                            th:value="${category.id}"
                            th:text="${category.icon != null ? category.icon + ' ' + category.name : category.name}"
                            th:selected="${division.workCategory != null
                                         and division.workCategory.id == category.id}">
                    </option>

                </select>

                <small>
                    Select the work category to which this division belongs.
                </small>

            </div>


            <!-- Description -->
            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                        id="description"
                        name="description"
                        class="form-control"
                        rows="4"
                        maxlength="500"
                        placeholder="Enter a short description"
                        th:text="${division.description}">
                </textarea>

            </div>




            <!-- Form Actions -->
            <div class="form-actions">

                <a th:href="${redirectUrl != null and !redirectUrl.isBlank() ? redirectUrl : '/admin/divisions'}"
                   class="cancel-btn">
                    Cancel
                </a>

                <button type="submit"
                        class="save-btn"
                        th:text="${division.id == null ? 'Create Division' : 'Update Division'}">
                    Create Division
                </button>

            </div>

        </form>

    </div>

</div>

    </main>

</div>

</body>
</html>
