spring.application.name=pravin-quotation

spring.datasource.url=jdbc:mysql://localhost:3306/pravin_kitchens
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

server.port=8080


# ==============================
# EMAIL CONFIGURATION
# ==============================

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ==============================
# WHATSAPP BUSINESS API CONFIGURATION
# ==============================
# Supported providers: meta, twilio, generic, mock, none
whatsapp.api.enabled=${WHATSAPP_API_ENABLED:false}
whatsapp.api.provider=${WHATSAPP_API_PROVIDER:meta}
whatsapp.api.url=${WHATSAPP_API_URL:}
whatsapp.api.token=${WHATSAPP_API_TOKEN:}
whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.api.account-sid=${WHATSAPP_ACCOUNT_SID:}
whatsapp.api.from-number=${WHATSAPP_FROM_NUMBER:}
whatsapp.api.media-token-secret=${WHATSAPP_MEDIA_TOKEN_SECRET:pravin-kitchens-secret-token-key-2026}
whatsapp.api.media-token-required=${WHATSAPP_MEDIA_TOKEN_REQUIRED:false}